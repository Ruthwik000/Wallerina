[project]
name = "backend"
version = "0.1.0"
description = "Wallerina backend: wallet analysis, risk metrics, Monte Carlo simulation and the agent pipeline behind its stablecoin allocation advice."
readme = "README.md"
authors = [
    { name = "dnspavankumar", email = "dnspavankumar722@gmail.com" },
    { name = "Gurram Ruthwik Goud", email = "gruthwik44@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.43.93",
    "eth-account>=0.14.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "numpy>=2.5.3",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Lets tests import shared helpers from each other (tests.test_allocation).
pythonpath = ["."]
